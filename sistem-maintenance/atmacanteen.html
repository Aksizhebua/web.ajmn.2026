<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Maintenance System - ATMACANTEEN</title>
    <!-- Menggunakan Tailwind CSS via CDN untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 untuk notifikasi yang lebih baik -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Firebase untuk dashboard laporan -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Font dari Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        /* Sembunyikan tab yang tidak aktif */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Customisasi warna tema AJMN */
        .bg-ajmn-gold { background-color: #b89442; }
        .hover\:bg-ajmn-gold-dark:hover { background-color: #7a5c1c; }
        .text-ajmn-gold { color: #b89442; }
        .border-ajmn-gold { border-color: #b89442; }
        .ring-ajmn-gold:focus { --tw-ring-color: #b89442; }
        .text-ajmn-brown-dark { color: #3e2009; }
        .file\:bg-ajmn-gold-light:hover { --tw-file-background-color: #f9f6ef; }
    </style>
</head>
<body class="bg-[#f8f9fb] min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-ajmn-gold text-white p-5 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-extrabold tracking-wide">VENUE MAINTENANCE SYSTEM</h1>
            <p class="text-sm text-yellow-50 opacity-90 font-medium">ATMACANTEEN</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        
        <!-- Tab Navigasi -->
        <div class="flex space-x-2 mb-6 border-b border-gray-200">
            <button onclick="switchTab('bulanan')" id="btn-bulanan" class="px-4 py-2 text-sm font-semibold border-b-2 border-ajmn-gold text-ajmn-gold">Checklist Bulanan</button>
            <button onclick="switchTab('ondemand')" id="btn-ondemand" class="px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Laporan On-Demand</button>
        </div>

        <!-- FORM 1: CHECKLIST BULANAN -->
        <div id="tab-bulanan" class="tab-content active bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-bold text-ajmn-brown-dark mb-5">Form Checklist Kebersihan</h2>
            
            <form id="formBulanan" class="space-y-5">
                <!-- Info Dasar -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi</label>
                        <div class="w-full border border-gray-300 rounded-md p-2 text-sm bg-gray-50 text-gray-800 font-medium">ATMACANTEEN</div>
                        <input type="hidden" name="lokasi" value="ATMACANTEEN">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bulan Pelaksanaan</label>
                        <input type="month" name="bulanTahun" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-1 ring-ajmn-gold focus:border-ajmn-gold">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Petugas</label>
                    <input type="text" name="namaPetugas" required placeholder="Nama pelaksana tugas" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-1 ring-ajmn-gold focus:border-ajmn-gold">
                </div>

                <!-- Checklist Kategori -->
                <div class="space-y-4">
                    <h3 class="font-semibold text-ajmn-brown-dark border-b pb-1">1. Area Atas & Sirkulasi</h3>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Exhaust Grill" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Exhaust Grill</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Exhaust Hood" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Exhaust Hood (Cook)</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Kipas Exhaust Cook" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Kipas Exhaust Cook</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Kipas Angin Kantin" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Kipas Angin Kantin</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Ceiling" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Ceiling / Plafon</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Tangga" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Tangga</span></label>
                    </div>

                    <h3 class="font-semibold text-ajmn-brown-dark border-b pb-1 mt-4">2. Area Visibilitas & Lantai</h3>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Shopfront" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Shopfront / Etalase Depan</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Dinding" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Dinding</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Meja" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Meja</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Kursi" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Kursi</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Sudut Lantai" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Sudut Lantai</span></label>
                        <label class="flex items-center space-x-3"><input type="checkbox" name="itemDibersihkan" value="Pencucian Lantai" class="w-5 h-5 text-ajmn-gold rounded focus:ring-ajmn-gold"> <span class="text-sm text-gray-700">Pembersihan & Pencucian Lantai</span></label>
                    </div>

                    <h3 class="font-semibold text-ajmn-brown-dark border-b pb-1 mt-4">3. Pest Control</h3>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3"><input type="checkbox" name="fogging" value="Ya" class="w-5 h-5 text-green-600 rounded focus:ring-green-500"> <span class="text-sm text-gray-700 font-medium">Fogging Bulanan Selesai</span></label>
                    </div>
                </div>

                <!-- Upload Bukti -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Upload Foto Bukti (Opsional)</label>
                    <!-- Input file asli kita sembunyikan -->
                    <input type="file" id="fotoBulanan" accept="image/*" multiple class="hidden">
                    <!-- Ini adalah tombol palsu yang kita styling, yang terhubung ke input asli via 'for' -->
                    <label for="fotoBulanan" class="cursor-pointer mt-1 inline-flex items-center gap-2 px-4 py-2 bg-[#f3e7c9] text-[#7a5c1c] text-sm font-semibold rounded-md border border-transparent hover:bg-[#e7d6b0] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        Tambah Foto
                    </label>
                    <p class="text-xs text-gray-400 mt-1">Bisa pilih lebih dari 1 foto (Before-After).</p>
                    <!-- Container untuk menampilkan daftar file yang dipilih -->
                    <div id="fileListContainer" class="mt-3 space-y-2"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Catatan Tambahan</label>
                    <textarea name="catatan" rows="3" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-1 ring-ajmn-gold focus:border-ajmn-gold" placeholder="Ada kendala atau kerusakan?"></textarea>
                </div>

                <button type="submit" id="btnSubmitBulanan" class="w-full bg-ajmn-gold text-white font-bold py-3 px-4 rounded-md hover:bg-ajmn-gold-dark transition-colors duration-300">
                    Simpan Laporan Bulanan
                </button>
            </form>
        </div>

        <!-- FORM 2: ON-DEMAND / TEMUAN HAMA -->
        <div id="tab-ondemand" class="tab-content bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-bold text-ajmn-brown-dark mb-5">Laporan Temuan Hama / Isu Mendadak</h2>
            <form id="formOnDemand" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi</label>
                    <div class="w-full border border-gray-300 rounded-md p-2 text-sm bg-gray-50 text-gray-800 font-medium">ATMACANTEEN</div>
                    <input type="hidden" name="lokasiReq" value="ATMACANTEEN">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Area Spesifik</label>
                    <input type="text" name="areaSpesifik" required placeholder="Contoh: Saluran air depan Tenant A" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-1 ring-ajmn-gold focus:border-ajmn-gold">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Temuan</label>
                    <textarea name="deskripsi" required rows="3" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-1 ring-ajmn-gold focus:border-ajmn-gold" placeholder="Contoh: Ditemukan banyak kecoa kecil di dekat exhaust grill..."></textarea>
                </div>

                <button type="submit" id="btnSubmitOnDemand" class="w-full bg-[#e74c3c] text-white font-bold py-3 px-4 rounded-md hover:bg-[#c0392b] transition-colors duration-300">
                    Kirim Permintaan Tindakan
                </button>
            </form>
        </div>

    </main>

    <!-- JavaScript untuk Logika UI & Pengiriman API -->
    <script>
        // --- KONFIGURASI API ---
        // Ganti string di bawah ini dengan Web App URL dari Google Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwX2RIg24zTalqqL7fUtzAb6N0uzjgGYfDVx758jutqqVeB9FmfjoLEG21RzEZl0d4nUw/exec"; 
        const firebaseConfig = {
            apiKey: "AIzaSyAJOW065La24rSO0VJ8k2-g2KpgBxO2TlA",
            authDomain: "ajmn-website.firebaseapp.com",
            projectId: "ajmn-website",
            storageBucket: "ajmn-website.firebasestorage.app",
            messagingSenderId: "223460999999",
            appId: "1:223460999999:web:a0758ffee209e3b49c898a"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const MAINTENANCE_COLLECTION = "maintenance_reports";

        async function saveMaintenanceReport(payload) {
            await db.collection(MAINTENANCE_COLLECTION).add({
                ...payload,
                submittedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Fungsi berpindah tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            if(tabId === 'bulanan') {
                document.getElementById('btn-bulanan').className = "px-4 py-2 text-sm font-semibold border-b-2 border-ajmn-gold text-ajmn-gold";
                document.getElementById('btn-ondemand').className = "px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700";
            } else {
                document.getElementById('btn-ondemand').className = "px-4 py-2 text-sm font-semibold border-b-2 border-ajmn-gold text-ajmn-gold";
                document.getElementById('btn-bulanan').className = "px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700";
            }
        }

        // Fungsi utilitas merubah file foto menjadi string Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // ambil data setelah koma
                reader.onerror = error => reject(error);
            });
        }

        // --- MANAJEMEN FILE FOTO ---
        let selectedFiles = []; // Array untuk menyimpan semua file yang dipilih secara bertahap
        const fileInput = document.getElementById('fotoBulanan');
        const fileListContainer = document.getElementById('fileListContainer');

        function renderFileList() {
            fileListContainer.innerHTML = ''; // Kosongkan daftar visual

            if (selectedFiles.length > 0) {
                const title = document.createElement('p');
                title.className = 'text-xs font-semibold text-gray-600';
                title.textContent = 'File yang akan diunggah:';
                fileListContainer.appendChild(title);

                selectedFiles.forEach((file, index) => {
                    const fileElement = document.createElement('div');
                    fileElement.className = 'flex items-center justify-between gap-2 bg-gray-50 p-2 rounded-md text-xs text-gray-800 border border-gray-200';
                    fileElement.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" /></svg>
                            <span class="truncate">${file.name}</span>
                        </div>
                        <button type="button" onclick="removeFile(${index})" class="text-red-500 hover:text-red-700 font-bold text-lg leading-none flex-shrink-0">&times;</button>
                    `;
                    fileListContainer.appendChild(fileElement);
                });
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1); // Hapus file dari array
            renderFileList(); // Perbarui tampilan
        }

        // --- MENAMPILKAN NAMA FILE YANG DIPILIH ---
        fileInput.addEventListener('change', function(e) {
            // Gabungkan file yang sudah ada dengan file yang baru dipilih
            const newFiles = Array.from(e.target.files);
            selectedFiles.push(...newFiles);
            renderFileList();
            // Reset input agar bisa memilih file yang sama lagi jika dihapus
            this.value = '';
        });

        // --- SUBMIT FORM BULANAN ---
        document.getElementById('formBulanan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitBulanan');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const formData = new FormData(e.target);
            const itemList = formData.getAll('itemDibersihkan');
            const items = itemList.join(', ');
            
            // PROSES BANYAK FOTO
            let fotoArray = []; // Gunakan array untuk menampung semua foto

            if (selectedFiles.length > 0) {
                // Looping untuk setiap foto yang dipilih
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const base64Data = await getBase64(file);
                    
                    // Masukkan tiap foto ke dalam array
                    fotoArray.push({
                        namaFoto: file.name,
                        mimeType: file.type,
                        fotoBase64: base64Data
                    });
                }
            }

            // Susun payload
            const payload = {
                tipeForm: "bulanan",
                lokasi: formData.get('lokasi'),
                bulanTahun: formData.get('bulanTahun'),
                namaPetugas: formData.get('namaPetugas'),
                itemDibersihkan: items,
                fogging: formData.get('fogging') ? "Selesai" : "Belum",
                catatan: formData.get('catatan'),
                fotoData: fotoArray // Kirim array foto ke backend
            };

            try {
                // Kirim ke Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                await response.json();

                try {
                    await saveMaintenanceReport({
                        tipeForm: "bulanan",
                        lokasi: payload.lokasi,
                        bulanTahun: payload.bulanTahun,
                        namaPetugas: payload.namaPetugas,
                        itemDibersihkan: itemList,
                        fogging: payload.fogging,
                        catatan: payload.catatan,
                        fotoCount: fotoArray.length,
                        fotoData: fotoArray
                    });
                } catch (dashboardError) {
                    console.warn("Laporan berhasil dikirim, tetapi gagal disimpan ke dashboard:", dashboardError);
                }

                Swal.fire({
                    title: 'Berhasil!',
                    text: 'Laporan bulanan berhasil disimpan.',
                    icon: 'success',
                    confirmButtonColor: '#b89442'
                });
                e.target.reset();
                selectedFiles = []; // Kosongkan array file
                renderFileList(); // Kosongkan tampilan list file
            } catch (error) {
                Swal.fire({
                    title: 'Gagal!',
                    text: 'Terjadi kesalahan atau koneksi terputus.',
                    icon: 'error',
                    confirmButtonColor: '#b89442'
                });
                console.error("Error!", error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Laporan Bulanan";
            }
        });

        // --- SUBMIT FORM ON-DEMAND ---
        document.getElementById('formOnDemand').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitOnDemand');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const formData = new FormData(e.target);
            
            const payload = {
                tipeForm: "ondemand",
                lokasi: formData.get('lokasiReq'),
                areaSpesifik: formData.get('areaSpesifik'),
                deskripsi: formData.get('deskripsi')
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                await response.json();

                try {
                    await saveMaintenanceReport({
                        tipeForm: "ondemand",
                        lokasi: payload.lokasi,
                        areaSpesifik: payload.areaSpesifik,
                        deskripsi: payload.deskripsi
                    });
                } catch (dashboardError) {
                    console.warn("Laporan on-demand berhasil dikirim, tetapi gagal disimpan ke dashboard:", dashboardError);
                }

                Swal.fire({
                    title: 'Berhasil!',
                    text: 'Laporan temuan berhasil dikirim. Tim akan segera menindaklanjuti.',
                    icon: 'success',
                    confirmButtonColor: '#b89442'
                });
                e.target.reset();
            } catch (error) {
                Swal.fire({
                    title: 'Gagal!',
                    text: 'Terjadi kesalahan saat mengirim laporan.',
                    icon: 'error',
                    confirmButtonColor: '#b89442'
                });
                console.error("Error!", error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Permintaan Tindakan";
            }
        });
    </script>
</body>
</html>
