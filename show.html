<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peresmian Website - AJMN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #2c1709;
            --bg-2: #160d06;
            --bg-3: #090604;
            --gold: #d6b06a;
            --gold-2: #f3dfb0;
            --white: #ffffff;
            --muted: rgba(255, 255, 255, 0.82);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(circle at 18% 18%, rgba(214, 176, 106, 0.18), transparent 22%),
                radial-gradient(circle at 82% 14%, rgba(214, 176, 106, 0.16), transparent 18%),
                radial-gradient(circle at 92% 6%, rgba(255, 211, 140, 0.14), transparent 11%),
                radial-gradient(circle at 8% 92%, rgba(214, 176, 106, 0.12), transparent 18%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 56%, var(--bg-3));
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.18;
            pointer-events: none;
        }

        .corner-ring {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            border: 1px solid rgba(214, 176, 106, 0.24);
        }

        .corner-ring.top-right {
            top: -108px;
            right: -84px;
            width: 260px;
            height: 260px;
            border-left-color: transparent;
            border-bottom-color: transparent;
        }

        .corner-ring.bottom-left {
            left: -120px;
            bottom: -120px;
            width: 220px;
            height: 220px;
            border-right-color: transparent;
            border-top-color: transparent;
            transform: rotate(18deg);
        }

        #main-container {
            position: relative;
            z-index: 1;
            width: min(92vw, 680px);
            padding: 42px 24px 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .poster {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-mark img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 14px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            margin: 6px 0 18px;
            color: var(--gold-2);
            font-size: 1rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
        }

        .section-label::before,
        .section-label::after {
            content: '';
            width: 96px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(214, 176, 106, 0.9));
        }

        .section-label::after {
            background: linear-gradient(90deg, rgba(214, 176, 106, 0.9), transparent);
        }

        .title {
            margin: 0;
            font-size: clamp(3rem, 8.4vw, 5rem);
            line-height: 0.92;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: transparent;
            background: linear-gradient(180deg, #fff8e4 5%, var(--gold) 56%, #8c662b 115%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 6px 26px rgba(0, 0, 0, 0.18);
        }

        .subtitle {
            margin: 12px 0 0;
            max-width: 540px;
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            line-height: 1.55;
            color: var(--muted);
        }

        .cta-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 34px;
        }

        .prompt {
            min-width: min(100%, 430px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 18px 34px;
            border: 1px solid rgba(214, 176, 106, 0.78);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(214, 176, 106, 0.18), rgba(255, 255, 255, 0.03)),
                rgba(26, 16, 8, 0.58);
            color: var(--gold-2);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24), inset 0 0 18px rgba(214, 176, 106, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
        }

        .prompt::after {
            content: '→';
            font-size: 1.3rem;
            line-height: 1;
        }

        .prompt:hover {
            transform: translateY(-2px);
            border-color: rgba(243, 223, 176, 0.96);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.3), inset 0 0 18px rgba(214, 176, 106, 0.12);
        }

        .prompt[disabled] {
            opacity: 0.72;
            cursor: default;
            transform: none;
        }

        .countdown-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            margin-top: 0;
            z-index: 2;
        }

        .countdown-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
        }

        .countdown-brand::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold-2);
            box-shadow: 0 0 16px rgba(214, 176, 106, 0.35);
        }

        .countdown-number {
            font-size: clamp(7rem, 26vw, 12rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            color: var(--white);
            text-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            transform: scale(1);
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .countdown-number.boom {
            transform: scale(1.18);
            color: var(--gold-2);
        }

        .logo-stage {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.72) translateY(12px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
        }

        .logo-stage.show {
            opacity: 1;
            transform: scale(1);
        }

        .logo-stage img {
            width: min(72vw, 440px);
            max-height: 240px;
            object-fit: contain;
        }

        .progress {
            position: fixed;
            left: 50%;
            bottom: 48px;
            transform: translateX(-50%);
            width: min(86vw, 430px);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 12px rgba(214, 176, 106, 0.08);
            z-index: 3;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            transform-origin: left center;
            background: linear-gradient(90deg, #8a5d26, var(--gold), var(--gold-2));
            animation: shrink 5s linear forwards;
        }

        @keyframes shrink {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            #main-container {
                padding: 24px 18px 26px;
            }

            .countdown-brand {
                margin-bottom: 14px;
                font-size: 0.64rem;
                letter-spacing: 0.14em;
            }

            .section-label {
                font-size: 0.85rem;
                gap: 10px;
            }

            .section-label::before,
            .section-label::after {
                width: 48px;
            }

            .title {
                font-size: clamp(2.15rem, 12vw, 3.2rem);
            }

            .subtitle {
                font-size: 0.92rem;
            }

            .prompt {
                min-width: 100%;
                padding: 16px 22px;
                letter-spacing: 0.16em;
                font-size: 0.9rem;
            }

            .logo-mark img {
                width: 74px;
                height: 74px;
            }

            .countdown-wrap {
                min-height: 100vh;
            }

            .logo-stage img {
                width: min(82vw, 320px);
            }
        }
    </style>
</head>
<body>
    <div class="corner-ring top-right" aria-hidden="true"></div>
    <div class="corner-ring bottom-left" aria-hidden="true"></div>

    <main id="main-container">
        <section class="poster" id="poster">
            <div class="logo-mark">
                <img src="images/Logo AJMNp.png" alt="Logo AJMN putih">
            </div>

            <div class="section-label">Peresmian</div>
            <h1 class="title">WEBSITE RESMI</h1>
            <p class="subtitle">Satu langkah menuju pelayanan yang lebih baik, informasi yang lengkap, dan kemudahan untuk semua.</p>

            <div class="cta-wrap">
                <button id="start-button" class="prompt" type="button">Resmikan Website</button>
            </div>
        </section>

        <section class="countdown-wrap hidden" id="countdown-wrap" aria-live="polite" aria-atomic="true">
            <div class="countdown-brand">ATMATERRA</div>
            <div id="countdown" class="countdown-number hidden">5</div>
            <div id="logo-stage" class="logo-stage">
                <img src="images/Logo AJMNp.png" alt="Logo AJMN putih">
            </div>
        </section>

        <div class="progress hidden" id="progress" aria-hidden="true">
            <div class="progress-bar"></div>
        </div>
    </main>

    <script>
        const startButtonEl = document.getElementById('start-button');
        const posterEl = document.getElementById('poster');
        const countdownWrapEl = document.getElementById('countdown-wrap');
        const progressEl = document.getElementById('progress');
        const countdownEl = document.getElementById('countdown');
        const logoStageEl = document.getElementById('logo-stage');

        let currentNumber = 5;
        let redirectStarted = false;
        let countdownStarted = false;

        function finishRedirect() {
            if (redirectStarted) return;
            redirectStarted = true;
            window.location.href = 'https://atmaterra.com';
        }

        function tick() {
            countdownEl.textContent = currentNumber;
            countdownEl.classList.remove('boom');
            void countdownEl.offsetWidth;
            countdownEl.classList.add('boom');

            if (currentNumber === 1) {
                logoStageEl.classList.add('show');
                setTimeout(finishRedirect, 1800);
                return;
            }

            currentNumber -= 1;
            setTimeout(tick, 1000);
        }

        startButtonEl.addEventListener('click', () => {
            if (countdownStarted) return;
            countdownStarted = true;
            startButtonEl.disabled = true;
            posterEl.classList.add('hidden');
            countdownWrapEl.classList.remove('hidden');
            progressEl.classList.remove('hidden');
            countdownEl.classList.remove('hidden');
            countdownEl.textContent = '5';
            setTimeout(tick, 500);
        });
    </script>
</body>
</html>
