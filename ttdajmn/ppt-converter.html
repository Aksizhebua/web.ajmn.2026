<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT to PDF Converter - AJMN Tools</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 for notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- JSZip untuk membuat file .zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="max-w-2xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="border-b border-slate-700 pb-4 mb-6 flex items-center">
            <div>
                <h1 class="text-3xl font-bold text-amber-400">PPT to PDF Converter</h1>
                <p class="text-slate-400 mt-1">Konversi file presentasi Anda ke format PDF dengan mudah.</p>
            </div>
        </div>

        <!-- Upload & Process Area -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-6">
            
            <div>
                <label for="pptInput" class="block text-sm font-semibold text-slate-300 mb-2">1. Upload File PPT atau PPTX (Bisa Pilih Banyak)</label>
                <div class="mt-2 flex justify-center rounded-lg border border-dashed border-slate-600 px-6 py-10">
                    <div class="text-center">
                        <svg class="mx-auto h-12 w-12 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                        </svg>
                        <div class="mt-4 flex text-sm leading-6 text-slate-400">
                            <label for="pptInput" class="relative cursor-pointer rounded-md font-semibold text-amber-400 focus-within:outline-none focus-within:ring-2 focus-within:ring-amber-500 focus-within:ring-offset-2 focus-within:ring-offset-slate-900 hover:text-amber-500">
                                <span>Pilih file-file Anda</span>
                                <input id="pptInput" name="pptInput" type="file" class="sr-only" accept=".ppt, .pptx" multiple>
                            </label>
                            <p class="pl-1">atau seret dan lepas di sini</p>
                        </div>
                        <p class="text-xs leading-5 text-slate-500">PPT, PPTX hingga 50MB</p>
                    </div>
                </div>
                <!-- Container untuk daftar file -->
                <div id="fileListContainer" class="mt-4 space-y-2"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button id="convertBtn" disabled
                    class="w-full sm:w-1/2 bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed transition duration-200 flex items-center justify-center gap-2">
                    <svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="btnText">Konversi Semua</span>
                </button>
                <button id="downloadAllBtn" disabled
                    class="w-full sm:w-1/2 bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed transition duration-200 flex items-center justify-center gap-2">
                    Unduh Semua (ZIP)
                </button>
            </div>
        </div>

    </div>

    <script>
        const pptInput = document.getElementById('pptInput');
        const fileNameDisplay = document.getElementById('fileName');
        const fileListContainer = document.getElementById('fileListContainer');
        const convertBtn = document.getElementById('convertBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        let filesToProcess = [];

        pptInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                filesToProcess = Array.from(e.target.files).map((file, index) => ({
                    id: `file-${index}-${Date.now()}`,
                    file: file,
                    status: 'waiting', // waiting, converting, done, error
                    pdfBlob: null,
                    errorMessage: ''
                }));
                renderFileList();
                convertBtn.disabled = false;
                convertBtn.className = "w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 cursor-pointer flex items-center justify-center gap-2";
                btnText.textContent = `Konversi ${filesToProcess.length} File`;
                downloadAllBtn.disabled = true;
                downloadAllBtn.className = "w-full sm:w-1/2 bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed transition duration-200 flex items-center justify-center gap-2";
            }
        });

        function renderFileList() {
            fileListContainer.innerHTML = '';
            filesToProcess.forEach(item => {
                const fileElement = document.createElement('div');
                fileElement.id = item.id;
                fileElement.className = 'bg-slate-700 p-3 rounded-lg flex items-center justify-between gap-3 text-sm';
                
                let statusIndicator = '';
                if (item.status === 'waiting') {
                    statusIndicator = `<span class="text-slate-400 font-medium">Menunggu</span>`;
                } else if (item.status === 'converting') {
                    statusIndicator = `<span class="text-sky-400 font-medium flex items-center gap-2"><svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Mengonversi...</span>`;
                } else if (item.status === 'done') {
                    statusIndicator = `<button onclick="downloadSingle('${item.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-1 px-3 rounded-md transition-colors">Unduh PDF</button>`;
                } else if (item.status === 'error') {
                    statusIndicator = `<span class="text-red-400 font-medium" title="${item.errorMessage}">Gagal</span>`;
                }

                fileElement.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-ppt-fill text-amber-400 shrink-0" viewBox="0 0 16 16"><path d="M8.188 10H7V6.5h1.188a1.75 1.75 0 1 1 0 3.5z"/><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707v5.586l-2.73-2.73a1 1 0 0 0-1.414 0l-3 3a1 1 0 0 0 0 1.414l4 4a1 1 0 0 0 1.414 0l.396-.396.396.396a1 1 0 0 0 1.414 0l2.121-2.121V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2l-3-3zM7.188 9H7V7.5h.188a.75.75 0 1 0 0-1.5H7V5h1.188a1.75 1.75 0 1 1 0 3.5H7.188z"/></svg>
                        <span class="truncate" title="${item.file.name}">${item.file.name}</span>
                    </div>
                    <div class="shrink-0">${statusIndicator}</div>
                `;
                fileListContainer.appendChild(fileElement);
            });
        }

        convertBtn.addEventListener('click', async () => {
            if (filesToProcess.length === 0) return;

            // --- Ganti dengan Secret Key Anda dari convertapi.com ---
            const CONVERTAPI_SECRET = 'qPZCzHmLWikoco5K6jaiaU0gukVxMFKk'; // <-- PENTING: Ganti ini

            if (CONVERTAPI_SECRET === 'YOUR_CONVERTAPI_SECRET_HERE') {
                Swal.fire('Konfigurasi Diperlukan', 'Harap masukkan Secret Key dari ConvertAPI di dalam kode JavaScript file ini.', 'warning');
                return;
            }

            setLoading(true);

            for (const item of filesToProcess) {
                item.status = 'converting';
                renderFileList();

                const fileExt = item.file.name.split('.').pop().toLowerCase();
                const converterPath = fileExt === 'pptx' ? 'pptx' : 'ppt';

                try {
                    const formData = new FormData();
                    formData.append('File', item.file);

                    const response = await fetch(`https://v2.convertapi.com/convert/${converterPath}/to/pdf`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${CONVERTAPI_SECRET}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.Message || `HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const pdfData = result.Files[0].FileData;
                    item.pdfBlob = b64toBlob(pdfData, 'application/pdf');
                    item.status = 'done';
                } catch (error) {
                    console.error('Conversion Error for ' + item.file.name, error);
                    item.status = 'error';
                    item.errorMessage = error.message;
                }
                renderFileList();
            }

            setLoading(false);
            const successfulConversions = filesToProcess.filter(item => item.status === 'done').length;
            if (successfulConversions > 0) {
                downloadAllBtn.disabled = false;
                downloadAllBtn.className = "w-full sm:w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 cursor-pointer flex items-center justify-center gap-2";
            }
            Swal.fire('Selesai!', `${successfulConversions} dari ${filesToProcess.length} file berhasil dikonversi.`, 'success');
        });

        function downloadSingle(itemId) {
            const item = filesToProcess.find(f => f.id === itemId);
            if (item && item.pdfBlob) {
                triggerDownload(item.pdfBlob, item.file.name.replace(/\.(pptx|ppt)$/i, '.pdf'));
            }
        }

        downloadAllBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            let filesAdded = 0;
            filesToProcess.forEach(item => {
                if (item.status === 'done' && item.pdfBlob) {
                    const newFileName = item.file.name.replace(/\.(pptx|ppt)$/i, '.pdf');
                    zip.file(newFileName, item.pdfBlob);
                    filesAdded++;
                }
            });

            if (filesAdded > 0) {
                Swal.fire({
                    title: 'Mengemas file ZIP...',
                    text: 'Mohon tunggu sebentar.',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading() }
                });
                const zipBlob = await zip.generateAsync({ type: "blob" });
                Swal.close();
                triggerDownload(zipBlob, 'converted_files.zip');
            } else {
                Swal.fire('Tidak ada file', 'Tidak ada file yang berhasil dikonversi untuk diunduh.', 'warning');
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                convertBtn.disabled = true;
                spinner.classList.remove('hidden');
                btnText.textContent = 'Sedang Memproses...';
            } else {
                convertBtn.disabled = true; // Disable after process
                convertBtn.className = "w-full sm:w-1/2 bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed transition duration-200 flex items-center justify-center gap-2";
                spinner.classList.add('hidden');
                btnText.textContent = 'Konversi Selesai';
            }
        }

        function triggerDownload(blob, fileName) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
            const byteCharacters = atob(b64Data);
            const byteArrays = [];
            for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                const slice = byteCharacters.slice(offset, offset + sliceSize);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            return new Blob(byteArrays, { type: contentType });
        }
    </script>
</body>
</html>
